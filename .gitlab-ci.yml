# Consent Manager — build & publish on GitLab.
#
# Replaces the GitHub Actions workflow. All versioning/build/publish logic lives
# centrally in openg2p/packaging (pinned @v1); this file only declares what THIS
# repo contains. See openg2p/packaging → ci/gitlab/README.md.
#
#   images -> registry.gitlab.com/openg2p/platform-services/consent-manager/<name>  (this project)
#   chart  -> openg2p/charts Helm Package Registry                (shared catalogue)

include:
  - project: 'openg2p/packaging'
    ref: v1                         # moving major tag; move it to roll out policy
    file: '/ci/gitlab/build-publish.yml'

variables:
  PACKAGING_REF: v1                 # keep EQUAL to the include ref above

  # `pins` are per-image: only the api Dockerfile declares ARG FASTAPI_COMMON_REF,
  # and `develop` is a BRANCH -- resolving it to a SHA keeps two builds of the
  # same commit identical. Image path = $CI_REGISTRY_IMAGE/<name>.
  IMAGES: |
    [
      {"name": "consent-manager-api",
       "dockerfile": "docker/consent-manager-api/Dockerfile",
       "pins": [
         {"arg": "FASTAPI_COMMON_REF",
          "repo": "https://github.com/openg2p/openg2p-fastapi-common",
          "ref": "develop"}
       ]},

      {"name": "consent-manager-sanity",
       "dockerfile": "docker/consent-manager-sanity/Dockerfile"},

      {"name": "consent-manager-ui",
       "dockerfile": "ui/Dockerfile",
       "context": "ui"}
    ]

  CHART_PATH: deployment/charts/openg2p-consent-manager

  # Every OpenG2P image the chart deploys. jbergknoff/postgresql-client is
  # third-party and stays pinned in values.yaml.
  CHART_IMAGE_PATHS: '[".ui.image.tag", ".consentManagerApi.image.tag", ".sanity.image.tag"]'

  # Shared catalogue -> all charts in ONE browsable Rancher repo.
  CHART_GITLAB_PROJECT: openg2p/charts

# ── Set these as GROUP CI/CD variables (masked) on the openg2p group ─────────
#   HELM_PUBLISH_USER  / HELM_PUBLISH_TOKEN  -> group deploy token with
#     write_package_registry (the job token can't write to the cross-project
#     openg2p/charts registry).
#   OPENROUTER_API_KEY -> AI changelog (optional; without it, human notes only).
#
# To skip AI or backfill a summary on a run, start a pipeline with variable
# CHANGELOG_SKIP_AI=true or CHANGELOG_REGENERATE=<version>.
