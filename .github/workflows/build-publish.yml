name: Build & Publish

# Replaces docker-build.yml + helm-publish.yml.
#
# One workflow, not two: a backend-only change must republish the chart, or the
# newest chart keeps pointing at the previous image. The old pair had disjoint
# path filters, so that desync was routine.
#
# This file declares only what THIS repo contains. All versioning policy lives
# in openg2p-packaging behind @v1 -- see that repo's ci/README.md.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  # These inputs are for two occasional changelog fixes only. For a normal run,
  # leave the checkbox OFF and the text box EMPTY (it rebuilds/publishes the
  # selected branch as usual).
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its frozen version e.g. 1.0.1 (not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    # Source + CI stay on GitHub; artifacts publish to GitLab (authenticated with
    # the GitLab deploy token below). `packages: write` is NOT used by the GitLab
    # path, but the shared @v1 reusable workflow's images/chart jobs declare it
    # (for the GHCR path), and GitHub requires the caller to grant at least what
    # the nested jobs request -- omitting it fails the run at startup.
    permissions:
      contents: read
      packages: write
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}

      # ── Publish everything to GitLab (images + chart), nothing elsewhere ──
      # GitLab registries are PER-PROJECT, so we split by purpose:
      #   * IMAGES  -> this product's own project `openg2p/consent-manager`
      #                (its Container Registry). Set THAT project private if the
      #                images must be private -- a project setting, not a flag.
      #   * CHART    -> a SHARED `openg2p/charts` project's Helm Package Registry,
      #                so Rancher adds ONE repo URL and browses EVERY OpenG2P
      #                chart + version. Every repo points its chart here.
      # A GROUP-level deploy token covers both projects.
      #
      # >>> `openg2p` is the assumed GitLab group path -- replace it here (2x),
      # >>> in `openg2p/charts` below, and in values.yaml image paths (3x) if
      # >>> your group's path differs.
      registry: registry.gitlab.com
      namespace: openg2p/consent-manager          # <group>/<project>; images land under it
      chart-gitlab-project: openg2p/charts        # SHARED catalog project (one Rancher repo for all charts)
      artifact-source: registry.gitlab.com/openg2p
      # `pins` are per-image: only the api Dockerfile declares ARG
      # FASTAPI_COMMON_REF, and `develop` is a BRANCH -- without resolving it to
      # a SHA, two builds of the same commit produce different images. No `repo`
      # override now: image path = registry/<namespace>/<name>.
      images: |
        [
          {"name": "consent-manager-api",
           "dockerfile": "docker/consent-manager-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "develop"}
           ]},

          {"name": "consent-manager-sanity",
           "dockerfile": "docker/consent-manager-sanity/Dockerfile"},

          {"name": "consent-manager-ui",
           "dockerfile": "ui/Dockerfile",
           "context": "ui"}
        ]

      chart-path: deployment/charts/openg2p-consent-manager

      # Every OpenG2P image the chart deploys. jbergknoff/postgresql-client is
      # third-party and stays pinned in values.yaml (by digest, ideally).
      chart-image-paths: |
        [".ui.image.tag",
         ".consentManagerApi.image.tag",
         ".sanity.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      # GitLab deploy token (registry + package registry write). Create as
      # repo/org secrets in GitHub -- see the setup notes.
      gitlab_registry_user: ${{ secrets.gitlab_registry_user }}
      gitlab_registry_token: ${{ secrets.gitlab_registry_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      # Org-level secret; if unset the changelog still publishes human notes.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
