name: Build & Publish

# Replaces docker-build.yml + helm-publish.yml.
#
# One workflow, not two: a backend-only change must republish the chart, or the
# newest chart keeps pointing at the previous image. The old pair had disjoint
# path filters, so that desync was routine.
#
# This file declares only what THIS repo contains. All versioning policy lives
# in openg2p-packaging behind @v1 -- see that repo's ci/README.md.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  # These inputs are for two occasional changelog fixes only. For a normal run,
  # leave the checkbox OFF and the text box EMPTY (it rebuilds/publishes the
  # selected branch as usual).
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its frozen version e.g. 1.0.1 (not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}
      # `pins` are per-image: only the api Dockerfile declares ARG
      # FASTAPI_COMMON_REF, and `develop` is a BRANCH -- without resolving it to
      # a SHA, two builds of the same commit produce different images.
      images: |
        [
          {"name": "consent-manager-api",
           "repo": "openg2p/openg2p-consent-manager",
           "dockerfile": "docker/consent-manager-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "develop"}
           ]},

          {"name": "consent-manager-sanity",
           "repo": "openg2p/openg2p-consent-manager-sanity",
           "dockerfile": "docker/consent-manager-sanity/Dockerfile"},

          {"name": "consent-manager-ui",
           "repo": "openg2p/openg2p-consent-manager-ui",
           "dockerfile": "ui/Dockerfile",
           "context": "ui"}
        ]

      chart-path: deployment/charts/openg2p-consent-manager

      # Every OpenG2P image the chart deploys. jbergknoff/postgresql-client is
      # third-party and stays pinned in values.yaml (by digest, ideally).
      chart-image-paths: |
        [".ui.image.tag",
         ".consentManagerApi.image.tag",
         ".sanity.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      # Org-level secret; if unset the changelog still publishes human notes.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
