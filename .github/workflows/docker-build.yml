name: Publish Consent Manager Docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      fastapi_common_ref:
        description: "openg2p-fastapi-common git ref (tag/branch)"
        default: "1.1"
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker - consent-manager-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Derive image tag from repo ref
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/consent-manager-api/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            FASTAPI_COMMON_REF=${{ inputs.fastapi_common_ref || '1.1' }}
          tags: openg2p/openg2p-consent-manager:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.repository }}@${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=openg2p-consent-manager
            org.opencontainers.image.description=OpenG2P Consent Manager API
