name: Publish Consent Manager Docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      fastapi_common_ref:
        description: "openg2p-fastapi-common git ref (tag/branch)"
        default: "develop"
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: consent-manager-api
            image: openg2p/openg2p-consent-manager
            dockerfile: docker/consent-manager-api/Dockerfile
            context: .
          - name: consent-manager-sanity
            image: openg2p/openg2p-consent-manager-sanity
            dockerfile: docker/consent-manager-sanity/Dockerfile
            context: .
          # Admin console SPA (React → nginx). Its Dockerfile expects the ui/
          # directory as the build context.
          - name: consent-manager-ui
            image: openg2p/openg2p-consent-manager-ui
            dockerfile: ui/Dockerfile
            context: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Derive image tag from repo ref
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push - ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            FASTAPI_COMMON_REF=${{ inputs.fastapi_common_ref || 'develop' }}
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.repository }}@${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ matrix.name }}
