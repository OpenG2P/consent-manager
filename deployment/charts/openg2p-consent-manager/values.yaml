global:
  namespace: "" # empty => auto-pick install namespace (.Release.Namespace)
  # Domain every hostname sits under: <service>.<baseDomain>. Inside
  # commons-services this is commons' own global.baseDomain. Rendered with tpl.
  baseDomain: '{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'

  # ── Database (shared commons Postgres) ──────────────────────────────────
  postgresqlHost: commons-postgresql
  consentDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  consentDBPort: 5432
  consentDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  consentDBSecret: '{{ .Release.Name }}-db'
  consentDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  # ── Hostname / routing (one per API audience) ───────────────────────────
  # staff console + admin API:
  consentManagerHostname: 'consent-manager.{{ tpl .Values.global.baseDomain $ }}'
  # partner-facing PDP (/validate, receipts, JWKS) — verified via PM keys:
  consentManagerPartnerHostname: 'consent-manager-partner.{{ tpl .Values.global.baseDomain $ }}'
  # beneficiary self-service (/my/*, origination) — scaffolded, disabled:
  consentManagerBeneHostname: 'consent-manager-bene.{{ tpl .Values.global.baseDomain $ }}'
  # partner portal SPA (assisted consent collection) — used only when
  # partnerPortal.enabled. Also the redirect/web origin of its Keycloak client.
  consentPartnerPortalHostname: 'consent-partner-portal.{{ tpl .Values.global.baseDomain $ }}'
  # Keycloak realm of partner users (partner portal). Used only when
  # partnerPortal.enabled; the partner-keycloak-init block creates it.
  consentPartnerRealm: partner

  # ── Keycloak (caller auth) ──────────────────────────────────────────────
  keycloakBaseUrl: 'https://keycloak.{{ tpl .Values.global.baseDomain $ }}'
  keycloakRealm: staff
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'
  # The issuer users' tokens carry (public Keycloak URL). Empty => same as
  # keycloakIssuerUrl. Umbrella charts that point keycloakIssuerUrl at the
  # INTERNAL Keycloak (commons) also define this as the external one.
  keycloakExternalIssuerUrl: ''
  consentManagerAuthEnabled: true
  consentManagerAuthClientId: consent-manager
  consentManagerAdminRole: CONSENT_MANAGER_ADMIN
  # Role required to verify assisted consents (approve or reject them).
  consentManagerApproverRole: CONSENT_MANAGER_APPROVER

  # ── Partner Management (partner keys and policies) ──────────────────────
  # Partners, their public keys and their access policies are owned by the
  # shared Partner Management (PM) service, part of commons-services (service
  # name commons-services-pm-*, matching the g2p-bridge chart). CM reads keys
  # and policies from PM's internal partner API at verification time. A
  # partner's audience maps to its PM partner: bank-a -> PARTNER_BANK_A.
  # Empty => nothing can be fetched and verification fails closed (deny).
  partnerManagementApiUrl: http://commons-services-pm-partner-api
  # PM's admin (staff-portal) API — used ONLY by the sanity e2e to seed a
  # persistent test partner. Not used by the running service.
  partnerManagementAdminApiUrl: http://commons-services-pm-staff-portal-api
  # Keycloak client the sanity seed authenticates AS to call PM's admin API. It
  # must hold PM's `partner_manager` role — Partner Management provisions this
  # client as `<pm-release>-staff-portal` and stores its secret in a K8s Secret
  # of the SAME name (key `client_secret`). In the commons install that is
  # `commons-services-staff-portal` (matches the g2p-bridge chart). This replaces
  # the older approach of granting partner_manager to CM's own service account.
  pmSeedClientId: commons-services-staff-portal

  # Partner policy cache. CM reads each partner's policy from Partner
  # Management and keeps it in a pod-local cache.
  #   ttlSeconds: how long a fetched policy is reused (also capped by PM's
  #     Cache-Control max-age), so an approved change applies within this time.
  #   hardTtlSeconds: while PM is down, the last fetched policy is still used
  #     for this long; after that, requests are denied.
  #   negativeTtlSeconds: how long "no policy" (PM 404) is remembered.
  #   fetchTimeoutSeconds: timeout of one call to PM.
  partnerPolicyCache:
    ttlSeconds: 60
    hardTtlSeconds: 21600
    negativeTtlSeconds: 30
    fetchTimeoutSeconds: 3

  # Partner Management staff UI, linked from the CM console (partners and
  # their policies are managed there).
  partnerManagementUiUrl: 'https://partner-management.{{ tpl .Values.global.baseDomain $ }}'

  # Each policy names the data controller (registry) it applies to; the
  # controller comes with each request. One CM serves many controllers, so
  # there is no global controller setting.

  # ── CM receipt signing key (PKCS#12) ────────────────────────────────────
  # Mount a .p12 from a Secret; see consentManagerApi.signingKey below.
  # consentSigningKid is a LABEL for the key (advertised in JWKS + receipts) —
  # it is NOT read from the .p12. Set your own when using your own key, and
  # change it on every key rotation so old/new public keys coexist in the JWKS.
  consentSigningKid: cm-2025-01

  # ── Agri Stack exchange (OFF by default) ────────────────────────────────
  # Consent tokens (short-lived, one per registry and query; called receipts
  # in the settings and API) between Consent Managers. Leave everything empty for a
  # standalone install: nothing is rendered and CM behaves exactly as before.
  # `role` picks working defaults: exchange (issues tokens to the composite;
  # with the partner portal, national-ID login on, Farmer ID required, the
  # composite at agri-composite.<this domain>) or department (trusts the
  # exchange CM at exchangeDomain). Empty fields below take those defaults.
  # Without a role, the fields act as set. `enabled` is the older Rancher switch.
  agriStackExchange:
    enabled: false
    role: ''
    defaultIssuer: agri-stack-exchange-cm
    defaultPresenter: agri-composite
    defaultSubjectIdentifiers: [FARMER_ID]
    # Department role: the exchange's domain; empty = agrix.<parent of this
    # install's domain>, e.g. agrix.openg2p.org for trial.openg2p.org.
    exchangeDomain: ''
    # Exchange role (the `agrix` install): issuer ID stamped as `iss` on the
    # consent tokens, and the callers (their partner_id / DCI sender_id, e.g.
    # agri-composite) allowed to request them with issue_receipts=true. A list
    # or a comma-separated string. Tokens are signed with the signing key
    # above and verifiable at the partner api's /.well-known/jwks.json.
    issuer: ''
    receiptPresenters: []
    receiptTtlSeconds: 900
    # Exchange role: consents made through the partner portal or the lifecycle
    # API are made for a use case granted to the partner in Partner
    # Management; its purpose and per-registry scopes are read from the
    # Composite's API (GET /composite/v1/use-cases/{name@major}). Empty = the
    # in-namespace Composite service below (exchange role); unset elsewhere.
    compositeApiUrl: ''
    defaultCompositeApiUrl: http://agri-composite-api
    # Department role (`trial`, `csr`): exchange CMs whose consent tokens /validate
    # accepts — list of {issuer, jwks_url, presenter, status_url?}; jwks_url is
    # the exchange CM partner api's /.well-known/jwks.json. The presenter needs
    # a scope policy per controller in this install's Partner Management.
    trustedReceiptIssuers: []
    # One trusted issuer as plain fields (Rancher); added to the list above
    # when trustedIssuer.issuer is set.
    trustedIssuer:
      issuer: ''
      jwksUrl: ''
      presenter: ''
    # Check each consent token's status at its issuer: always | never.
    receiptStatusCheck: always

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.consentDB $ }}'
      user: '{{ tpl .Values.global.consentDBUser $ }}'
      secret: '{{ tpl .Values.global.consentDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.consentDBUserPasswordKey $ }}'

# Provisions the Consent Manager client + admin role in Keycloak. Requires the
# commons Keycloak to be reachable with admin credentials. The CM service itself
# only validates tokens via JWKS (no client secret needed) — this block exists to
# DEFINE the CONSENT_MANAGER_ADMIN role and to give admin automation / PEP callers
# a confidential client to obtain client-credentials tokens from.
keycloak-init:
  enabled: true
  keycloak:
    # Internal URL to reach Keycloak within the namespace (commons layer).
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  suffix: '{{ .Release.Namespace }}'
  realms:
    '{{ tpl .Values.global.keycloakRealm $ }}':
      clients:
        # Confidential client. keycloak-init auto-generates a K8s Secret named
        # `consent-manager` with key `client_secret`. The CONSENT_MANAGER_ADMIN
        # client role is defined here and read from resource_access in the token.
        - clientId: consent-manager
          name: OpenG2P Consent Manager
          description: API client + role definitions for the Consent Manager. Service account enabled so onboarding automation / PEP callers can obtain client-credentials tokens.
          publicClient: false
          serviceAccountsEnabled: true
          redirectUris:
            - 'https://{{ tpl .Values.global.consentManagerHostname $ }}/*'
          clientRoles:
            # Required by the admin endpoints. Must match
            # global.consentManagerAdminRole.
            - CONSENT_MANAGER_ADMIN
            # Required to verify assisted consents. Must match
            # global.consentManagerApproverRole. Grant to verifier users.
            - CONSENT_MANAGER_APPROVER
        # PUBLIC browser client for the admin console SPA (login via Keycloak).
        # No secret; roles come from the logged-in user's assignments. Served on
        # the same host as the staff API, so redirect back there.
        - clientId: consent-manager-ui
          name: OpenG2P Consent Manager Console
          publicClient: true
          standardFlowEnabled: true
          redirectUris:
            - 'https://{{ tpl .Values.global.consentManagerHostname $ }}/*'
          webOrigins:
            - 'https://{{ tpl .Values.global.consentManagerHostname $ }}'
      users:
        # First-install operator: admin, and can verify assisted consents.
        - username: admin
          clientRoleMappings:
            consent-manager:
              - CONSENT_MANAGER_ADMIN
              - CONSENT_MANAGER_APPROVER
        # The client's own service account gets admin too, so client-credentials
        # tokens from `consent-manager` can drive CM's own admin automation.
        - username: service-account-consent-manager
          clientRoleMappings:
            consent-manager:
              - CONSENT_MANAGER_ADMIN
            # NOTE: PM's `partner_manager` role is NO LONGER granted here. The
            # sanity seed instead authenticates AS PM's own admin client
            # (global.pmSeedClientId = commons-services-staff-portal), which
            # already holds partner_manager — see the g2p-bridge pmSeedClientId
            # pattern. This avoids referencing a PM Keycloak client from CM's
            # keycloak-init (a missing client would fail this init job).

# Partner realm for the partner portal — a second keycloak-init run, installed
# only when partnerPortal.enabled (Chart.yaml condition). Set `enabled: false`
# here to skip it while the portal is on (realm managed by hand).
#
# keycloak-init (0.0.0-develop.60) creates the realm and the public client. It
# CANNOT create realm roles, declare user-profile attributes, add custom
# protocol mappers, enforce PKCE or set user attributes — do these once in the
# Keycloak admin console (realm `partner`) after the first install:
#   1. Realm roles → Create role: PARTNER_OPERATOR, then PARTNER_ADMIN.
#   2. Realm settings → User profile → Create attribute `partner_id`
#      (who can view/edit: admin only). Keycloak 24+ drops undeclared attributes.
#   3. Clients → consent-partner-portal → Client scopes →
#      consent-partner-portal-dedicated → Add mapper → By configuration →
#      User Attribute: name `partner_id`, user attribute `partner_id`, token
#      claim name `partner_id`, JSON type String, add to access token ON
#      (ID token / userinfo ON too).
#   4. Clients → consent-partner-portal → Advanced → PKCE method S256
#      (optional: the portal always sends PKCE; this makes it mandatory).
#   5. Users → Add user per partner employee: set attribute `partner_id` (the
#      partner's ID in Partner Management, e.g. bank-a), assign PARTNER_OPERATOR
#      or PARTNER_ADMIN, set a password. For partnerPortal.testUsers use the
#      passwords in the <release>-partner-test-users Secret.
partner-keycloak-init:
  keycloak:
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  realms:
    # Must equal global.consentPartnerRealm.
    partner:
      # The OpenG2P login page labelled "Partner Portal" (theme in the
      # keycloak-themes image, as staff-portal / agent-portal for the staff and
      # agent realms). An image without it falls back to Keycloak's own page.
      themes:
        loginTheme: partner-portal
        adminTheme: partner-portal
      clients:
        # PUBLIC browser client for the partner portal SPA (standard flow; the
        # SPA uses PKCE). Redirects back to the portal host only.
        - clientId: consent-partner-portal
          name: OpenG2P Consent Partner Portal
          publicClient: true
          standardFlowEnabled: true
          redirectUris:
            - 'https://{{ tpl .Values.global.consentPartnerPortalHostname $ }}/*'
          webOrigins:
            - 'https://{{ tpl .Values.global.consentPartnerPortalHostname $ }}'

# Admin console SPA (React → nginx), served on the SAME host as the staff API
# (a single VirtualService routes /consent/ → staff API, / → this UI). Runtime
# config.json (Keycloak URL/realm/clientId, roles) is injected via a ConfigMap.
ui:
  enabled: true
  nameOverride: ui
  hostname: '{{ tpl .Values.global.consentManagerHostname $ }}'
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
  autoscaling:
    enabled: false
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/consent-manager-ui
    tag: develop
    pullPolicy: Always
  containerPort: 8080
  podSecurityContext:
    enabled: false
    fsGroup: 101          # nginx-unprivileged user
  containerSecurityContext:
    enabled: false
    runAsUser: 101
    runAsNonRoot: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 80
  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    periodSeconds: 5
    failureThreshold: 10
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    periodSeconds: 10
  # Client id of the PUBLIC browser client provisioned in keycloak-init above.
  clientId: consent-manager-ui

# ── Partner portal (OFF by default) ─────────────────────────────────────────
# SPA for partner users (e.g. bank staff) to collect assisted consent: create a
# consent request, upload the signed form, submit it for staff verification.
# Logs in against the Keycloak `partner` realm (see partner-keycloak-init). Off
# for a standalone install: nothing below is rendered and CM behaves as before.
# When ON it also:
#   - sets the staff api's partner-realm token settings (partner portal API
#     /consent/v1/partner-portal is served by the STAFF api deployment), and
#   - turns on evidence storage (see `evidence` below).
partnerPortal:
  enabled: false
  nameOverride: partner-portal
  hostname: '{{ tpl .Values.global.consentPartnerPortalHostname $ }}'
  # Base URL the SPA calls the partner portal API at. Empty (default) = same
  # origin: the portal's VirtualService routes /consent/v1/partner-portal/ on
  # the portal host to the staff api (no CORS needed). Set a full URL only if
  # that host allows the portal origin (CORS).
  apiBaseUrl: ''
  # Optional Agri Stack composite base URL (e.g. https://composite.<domain>);
  # when set the portal shows the use-case catalogue (GET /composite/v1/use-cases).
  compositeUrl: ''
  keycloak:
    # Public Keycloak URL (browser login + the `iss` of partner tokens).
    url: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
    realm: '{{ tpl .Values.global.consentPartnerRealm $ }}'
    # Must match the client in partner-keycloak-init.
    clientId: consent-partner-portal
    # In-cluster Keycloak URL the CM api fetches the partner realm JWKS from.
    internalUrl: '{{ index .Values "keycloak-init" "keycloak" "url" }}'
    # Issuer CM accepts on partner tokens, and where it fetches their keys.
    issuerUrl: '{{ tpl .Values.partnerPortal.keycloak.url $ }}/realms/{{ tpl .Values.partnerPortal.keycloak.realm $ }}'
    jwksUrl: '{{ tpl .Values.partnerPortal.keycloak.internalUrl $ }}/realms/{{ tpl .Values.partnerPortal.keycloak.realm $ }}/protocol/openid-connect/certs'
  operatorRole: PARTNER_OPERATOR
  adminRole: PARTNER_ADMIN
  # Other identifiers of the subject every assisted request must carry besides
  # its subject ID, e.g. [FARMER_ID] in Agri Stack (a list, or a comma-separated
  # string from the Rancher form). Staff confirm them in the registry before
  # approving.
  requiredSubjectIdentifiers: []
  # Named in the consent record a partner downloads, to check the CM's signature
  # on it: the partner api's public JWKS.
  consentRecordJwksUrl: 'https://{{ tpl .Values.global.consentManagerPartnerHostname $ }}/api/consent-manager-partner/.well-known/jwks.json'
  # The subject's national-ID login during an assisted request (consent
  # scenario 1, phase 2): eSignet, as the registry's beneficiary authentication
  # for credentials. When on it is MANDATORY: a request cannot be submitted
  # until its subject has authenticated (the signed form is still required).
  # Needs eSignet (and, for testing, the mock identity system) in the namespace.
  subjectAuth:
    enabled: false
    providerName: National ID (eSignet)
    esignetHostname: 'esignet.{{ tpl .Values.global.baseDomain $ }}'
    discoveryUrl: 'https://{{ tpl .Values.partnerPortal.subjectAuth.esignetHostname $ }}/.well-known/openid-configuration'
    # The CM's OIDC client in eSignet (registered by the job below).
    clientId: '{{ .Release.Name }}-consent-partner-portal'
    # eSignet sends the browser back here: the portal host routes
    # /consent/v1/partner-portal/ to the CM api.
    redirectUri: 'https://{{ tpl .Values.global.consentPartnerPortalHostname $ }}/consent/v1/partner-portal/subject-auth/callback'
    acrValues: 'mosip:idp:acr:generated-code'
    # Subject ID types that are the national ID (only these can log in).
    idTypes: [FAYDA_FAN, NATIONAL_ID, national_id]
    # The client's RSA key (private_key_jwt), kept in this Secret (key client.pem)
    # and mounted into the api; generated once by the job, never rotated by it.
    keySecretName: '{{ .Release.Name }}-subject-auth-client-key'
    keyMountPath: /subject-auth
    # Registers the client in eSignet's database (its client API needs a scope
    # an install cannot obtain): a regular Job, re-run on each upgrade, that
    # waits for eSignet's tables. Turn off where another system owns eSignet.
    bootstrap:
      enabled: true
      esignetDbName: mosip_esignet
      esignetDbUser: esignetuser
      esignetDbSecret: esignet-db-user
      esignetDbSecretKey: esignet-db-user-password
      # Claims the client may ask for (individual_id is what is matched).
      claims: [name, individual_id]
      keygenImage: python:3.12-slim
      psqlImage: postgres:16-alpine
      kubectlImage: alpine/k8s:1.31.0
      waitSeconds: 1200
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 200m, memory: 128Mi}
  # Test partner users (testing only). For each entry the chart keeps a
  # generated password in the Secret below (key = username; kept across
  # upgrades and uninstall). keycloak-init cannot set user attributes or read
  # passwords from a Secret, so create these users by hand (see the steps above
  # partner-keycloak-init) with these values:
  #   - {username: bank-a-operator, partnerId: bank-a, roles: [PARTNER_OPERATOR]}
  testUsers: []
  testUsersSecretName: '{{ .Release.Name }}-partner-test-users'
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
  autoscaling:
    enabled: false
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/consent-manager-partner-portal
    tag: develop
    pullPolicy: Always
  containerPort: 8080
  podSecurityContext:
    enabled: false
    fsGroup: 101          # nginx-unprivileged user
  containerSecurityContext:
    enabled: false
    runAsUser: 101
    runAsNonRoot: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 80
  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    periodSeconds: 5
    failureThreshold: 10
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    periodSeconds: 10

# ── Consent evidence storage (signed consent forms) ─────────────────────────
# S3-compatible object storage for evidence uploaded through the partner
# portal. Rendered into the staff api when `enabled` OR partnerPortal.enabled;
# otherwise unset (uploads answer 503). Defaults: the OpenG2P commons Garage
# and its shared read-write key (Secret `commons-minio`, written by the commons
# Garage init job — historical name).
# The bucket must exist and the key must be allowed on it (the commons Garage
# key cannot create buckets). The commons-base Garage init job creates
# consent-evidence and grants garage-key on it; on an older commons-base, once
# in the garage pod:
#   garage bucket create consent-evidence
#   garage bucket allow --read --write --owner consent-evidence --key garage-key
evidence:
  enabled: false
  s3:
    endpoint: 'http://commons-garage:3900'
    bucket: consent-evidence
    # Must equal the Garage S3 region (commons Garage: us-east-1).
    region: us-east-1
    existingSecret: commons-minio
    accessKeyKey: root-user
    secretKeyKey: root-password
  maxBytes: 10485760

# Additional API-audience deployments in THIS chart (same image, separate
# Deployment/Service/VirtualService). Each entry is merged OVER consentManagerApi,
# so it only needs to state its differences. This is how the one chart runs the
# partner api (PM keys, no Keycloak) and a scaffolded beneficiary api alongside
# the staff api above.
extraApis:
  # PARTNER api — the PDP. Trust = partner-signed consent object via PM keys;
  # NO Keycloak. Mints receipts + serves JWKS, so it mounts the signing key.
  - enabled: true
    nameOverride: partner-api
    apiAudience: partner
    authEnabled: 'false'
    signingKeyMounted: true
    hostname: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
    openapiRootPath: /api/consent-manager-partner
    istio:
      enabled: true
      virtualservice:
        enabled: true
        host: '{{ tpl .Values.global.consentManagerPartnerHostname $ }}'
        gateway: "internal"
        destination: '{{ .Release.Name }}-partner-api'
        destinationPort: 80
        prefix: /api/consent-manager-partner/
        rewriteUri: "/"
      gateway:
        enabled: false
  # BENEFICIARY api — /my/* + origination. Keycloak beneficiary realm. Scaffolded
  # but DISABLED — enable when you expose beneficiary self-service.
  - enabled: false
    nameOverride: bene-api
    apiAudience: beneficiary
    authEnabled: 'true'
    signingKeyMounted: false
    hostname: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
    openapiRootPath: /api/consent-manager-bene
    istio:
      enabled: true
      virtualservice:
        enabled: true
        host: '{{ tpl .Values.global.consentManagerBeneHostname $ }}'
        gateway: "internal"
        destination: '{{ .Release.Name }}-bene-api'
        destinationPort: 80
        prefix: /api/consent-manager-bene/
        rewriteUri: "/"
      gateway:
        enabled: false

consentManagerApi:
  enabled: true
  nameOverride: api
  hostname: '{{ tpl .Values.global.consentManagerHostname $ }}'
  # ── API audience (the platform's 4-API pattern) ─────────────────────────
  # This deployment is the STAFF api: Keycloak (staff realm) — consents,
  # assisted-consent verifications, decisions. The PARTNER api (PDP /validate,
  # verified via PM keys, no Keycloak) and a scaffolded BENEFICIARY api are
  # defined in `extraApis` below — same image, same chart, separate Deployments.
  apiAudience: staff
  authEnabled: '{{ .Values.global.consentManagerAuthEnabled }}'
  # The staff api never signs — receipts/JWKS are the partner api's job — so the
  # signing key is NOT mounted here (only on the partner api).
  signingKeyMounted: false
  replicaCount: 1

  # Horizontal scaling — the pods are stateless, so turn this on for high
  # consent-verification load. Off by default (a single replica is enough).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # Memory-based autoscaling is intentionally OFF: a Python process's memory
    # baseline can exceed the request and never shrink, which makes a memory HPA
    # scale up to maxReplicas and stay there. Autoscale on CPU only.
    targetMemoryUtilizationPercentage: null

  updateStrategy:
    type: RollingUpdate

  serviceAccount:
    create: false
    name: ""

  image:
    repository: openg2p/consent-manager-api
    # Image tag — defaults to the develop stream. Override per release/deploy
    # (e.g. --set consentManagerApi.image.tag=1.2.0).
    tag: "develop"
    pullPolicy: Always

  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /api/consent-manager
  containerPort: 8000

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.consentManagerApi.hostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-api'
      destinationPort: 80
      prefix: '{{ .Values.consentManagerApi.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false

  # ── CM signing key (.p12) mounted from a Secret ─────────────────────────
  # Receipts are ALWAYS signed. A fresh install uses the BUNDLED DEMO key so it
  # works out of the box (testing) — REPLACE IT FOR PRODUCTION (the demo key +
  # password ship in this chart and are public). The only real choice is `mode`.
  signingKey:
    # Advanced / internal — leave true. Set false ONLY for a throwaway local pod
    # where you accept a per-pod ephemeral key (no shared, persistent key). This
    # is not exposed in the Rancher form; production always signs with a .p12.
    enabled: true
    # Where the .p12 comes from:
    #   demo     → use the demo key bundled in this chart (files/cm_signing_demo.p12).
    #              Fixed, consistent across pods. Testing only.
    #   existing → reference a Secret you created via Rancher Storage → Secrets
    #              (file upload — no CLI). Set `secretName` to its name. PRODUCTION.
    #   inline   → the chart creates the Secret from `p12Base64` + `password` below.
    #              Convenient, but the material lives in the Helm release.
    mode: demo
    demoPassword: openg2p
    # Inline material — used only when mode=inline:
    p12Base64: ""
    password: ""
    # Secret reference (the chart-created Secret, for demo/inline, also takes this name):
    secretName: consent-manager-signing
    secretKey: cm_signing.p12
    mountPath: /app/secrets
    # Empty: the same Secret as the .p12 (secretName).
    passwordSecretName: ''
    passwordSecretKey: password

  # ── Periodic expiry sweep (CronJob) ─────────────────────────────────────
  # Keeps API pods stateless — expiry runs once per tick regardless of replicas.
  expiryCronjob:
    enabled: true
    schedule: "*/15 * * * *"
    backoffLimit: 1
    # Auto-clean finished Jobs so they don't accumulate in Rancher/kubectl.
    ttlSecondsAfterFinished: 600
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1

  envVars:
    CONSENT_MANAGER_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    CONSENT_MANAGER_DB_DBNAME: '{{ tpl .Values.global.consentDB $ }}'
    CONSENT_MANAGER_DB_PORT: '{{ .Values.global.consentDBPort }}'
    CONSENT_MANAGER_DB_USERNAME: '{{ tpl .Values.global.consentDBUser $ }}'
    CONSENT_MANAGER_APP_PORT: '{{ .Values.containerPort }}'
    CONSENT_MANAGER_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'
    # NB: CONSENT_MANAGER_AUTH_ENABLED and CONSENT_MANAGER_CM_SIGNING_P12_PATH are
    # set PER-DEPLOYMENT (see apiAudience / authEnabled / signingKeyMounted) — the
    # partner api runs auth-disabled and the signing key only mounts on it.
    CONSENT_MANAGER_AUTH_ISSUER: '{{ tpl .Values.global.keycloakIssuerUrl $ }}'
    CONSENT_MANAGER_AUTH_JWKS_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/certs'
    CONSENT_MANAGER_AUTH_ADMIN_ROLE: '{{ tpl .Values.global.consentManagerAdminRole $ }}'
    CONSENT_MANAGER_AUTH_APPROVER_ROLE: '{{ tpl .Values.global.consentManagerApproverRole $ }}'
    # Partner Management partner API — source of partner keys and policies.
    CONSENT_MANAGER_PARTNER_MGMT_API_URL: '{{ tpl .Values.global.partnerManagementApiUrl $ }}'
    # Partner policy cache (see global.partnerPolicyCache).
    CONSENT_MANAGER_PARTNER_POLICY_CACHE_TTL_SECONDS: '{{ .Values.global.partnerPolicyCache.ttlSeconds }}'
    CONSENT_MANAGER_PARTNER_POLICY_HARD_TTL_SECONDS: '{{ .Values.global.partnerPolicyCache.hardTtlSeconds }}'
    CONSENT_MANAGER_PARTNER_POLICY_NEGATIVE_TTL_SECONDS: '{{ .Values.global.partnerPolicyCache.negativeTtlSeconds }}'
    CONSENT_MANAGER_PARTNER_POLICY_FETCH_TIMEOUT_SECONDS: '{{ .Values.global.partnerPolicyCache.fetchTimeoutSeconds }}'
    # In demo mode, force a distinctive kid so any receipt / JWKS makes it obvious
    # a demo (insecure) key is in use; otherwise use the configured kid.
    CONSENT_MANAGER_CM_SIGNING_KID: '{{ if eq .Values.signingKey.mode "demo" }}cm-demo-INSECURE{{ else }}{{ tpl .Values.global.consentSigningKid $ }}{{ end }}'
    CONSENT_MANAGER_CM_SIGNING_IS_DEMO: '{{ if and .Values.signingKey.enabled (eq .Values.signingKey.mode "demo") }}true{{ else }}false{{ end }}'
    # (CONSENT_MANAGER_CM_SIGNING_P12_PATH is set per-deployment when
    #  signingKeyMounted — only the partner api, which mints receipts.)

  envVarsFrom:
    CONSENT_MANAGER_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.consentDBSecret $ }}'
        key: '{{ tpl .Values.global.consentDBUserPasswordKey $ }}'
    CONSENT_MANAGER_CM_SIGNING_P12_PASSWORD:
      secretKeyRef:
        name: '{{ .Values.signingKey.passwordSecretName | default .Values.signingKey.secretName }}'
        key: '{{ .Values.signingKey.passwordSecretKey }}'
        optional: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
      - 'sh'
    args:
      - '-c'
      # Wait until we can actually AUTHENTICATE as the app role — not just until
      # the server accepts connections (pg_isready). This prevents migrate from
      # running before postgres-init has provisioned the role/password, which
      # otherwise fails auth and leaves an empty schema.
      - 'until PGPASSWORD="${CONSENT_MANAGER_DB_PASSWORD}" psql -h "${CONSENT_MANAGER_DB_HOSTNAME}" -p "${CONSENT_MANAGER_DB_PORT:-5432}" -U "${CONSENT_MANAGER_DB_USERNAME}" -d "${CONSENT_MANAGER_DB_DBNAME:-consent_manager_db}" -c "select 1" >/dev/null 2>&1; do echo "waiting for db auth..."; sleep 3; done'
    containerSecurityContext:
      enabled: false

# ── In-cluster sanity suite ─────────────────────────────────────────────────
# A Helm post-install/post-upgrade Job that runs the sanity tests against the
# freshly deployed service. Because it is a Helm hook, a failed Job fails the
# whole release — so if sanity runs, the deploy is only "successful" when it
# passes. The default smoke+contract level creates NO data and is safe in every
# environment, so keep it on. Disable is a BREAK-GLASS only for when the sanity
# IMAGE itself can't run (not mirrored / bad build) and is blocking the deploy at
# the pod level — failOnError can't rescue that, since the container never starts.
# (Data is created only by the e2e, which is its own opt-in.)
sanity:
  enabled: true
  # Infix inserted into the sanity + pm-seed Job names, so they line up with the
  # component nameOverrides (api/ui/…). Empty → <release>-sanity / <release>-pm-seed
  # (unchanged). Set e.g. "cm" → <release>-cm-sanity / <release>-cm-pm-seed.
  nameOverride: ""
  image:
    # sanity's template renders `repository:tag` directly (no registry field),
    # so the full GitLab image path goes in the repository.
    repository: openg2p/consent-manager-sanity
    tag: develop
    pullPolicy: Always
  # In-cluster Service URLs (no ingress path prefix). Staff api = <release>-api;
  # partner api (/validate, JWKS, receipts) = <release>-partner-api. Both :80.
  baseUrl: 'http://{{ .Release.Name }}-api'
  partnerBaseUrl: 'http://{{ .Release.Name }}-partner-api'
  verifyTls: false
  # true (default) → also run the signed /validate round-trip. This deploys a
  #   pm-seed Job first that ensures a persistent test partner (cm-sanity =
  #   PM PARTNER_CM_SANITY), its key and a scope policy for controllerId exist
  #   in Partner Management (via PM's admin API), then the e2e signs against it.
  #   Needs a Keycloak token + reachable PM at deploy time.
  # false → smoke + contract only (seeds nothing, creates no data, needs no
  #   token). Set this for production where you don't want test data created.
  runE2e: true
  # GATE the deploy on sanity. true (default) → a failing run fails the Job and
  # therefore the install/upgrade. ADVANCED escape hatch: set false for
  # report-only (Job exits 0 on failure, deploy succeeds; read the pod logs).
  # Not exposed in the Rancher form — running sanity gates by design.
  failOnError: true
  readinessTimeout: 180
  # Data controller of the sanity partner's PM policy (a test-only controller).
  controllerId: sanity-controller
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
