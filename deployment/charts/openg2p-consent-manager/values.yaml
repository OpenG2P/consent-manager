global:
  namespace: "" # empty => auto-pick install namespace (.Release.Namespace)

  # ── Database (shared commons Postgres) ──────────────────────────────────
  postgresqlHost: commons-postgresql
  consentDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  consentDBPort: 5432
  consentDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  consentDBSecret: '{{ .Release.Name }}-db'
  consentDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  # ── Hostname / routing ──────────────────────────────────────────────────
  consentManagerHostname: 'consent-manager.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'

  # ── Keycloak (caller auth) ──────────────────────────────────────────────
  keycloakBaseUrl: 'https://keycloak.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'
  keycloakRealm: staff
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'
  consentManagerAuthEnabled: true
  consentManagerAuthClientId: consent-manager
  consentManagerAdminRole: CONSENT_MANAGER_ADMIN

  # The data controller / module is a per-partner attribute set at onboarding —
  # one shared CM serves many modules, so there is no global controller setting.

  # ── CM receipt signing key (PKCS#12) ────────────────────────────────────
  # Mount a .p12 from a Secret; see consentManagerApi.signingKey below.
  # consentSigningKid is a LABEL for the key (advertised in JWKS + receipts) —
  # it is NOT read from the .p12. Set your own when using your own key, and
  # change it on every key rotation so old/new public keys coexist in the JWKS.
  consentSigningKid: cm-2025-01

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.consentDB $ }}'
      user: '{{ tpl .Values.global.consentDBUser $ }}'
      secret: '{{ tpl .Values.global.consentDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.consentDBUserPasswordKey $ }}'

# Provisions the Consent Manager client + admin role in Keycloak. Requires the
# commons Keycloak to be reachable with admin credentials. The CM service itself
# only validates tokens via JWKS (no client secret needed) — this block exists to
# DEFINE the CONSENT_MANAGER_ADMIN role and to give admin automation / PEP callers
# a confidential client to obtain client-credentials tokens from.
keycloak-init:
  enabled: true
  keycloak:
    # Internal URL to reach Keycloak within the namespace (commons layer).
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  suffix: '{{ .Release.Namespace }}'
  realms:
    '{{ tpl .Values.global.keycloakRealm $ }}':
      clients:
        # Confidential client. keycloak-init auto-generates a K8s Secret named
        # `consent-manager` with key `client_secret`. The CONSENT_MANAGER_ADMIN
        # client role is defined here and read from resource_access in the token.
        - clientId: consent-manager
          name: OpenG2P Consent Manager
          description: API client + role definitions for the Consent Manager. Service account enabled so onboarding automation / PEP callers can obtain client-credentials tokens.
          publicClient: false
          serviceAccountsEnabled: true
          redirectUris:
            - 'https://{{ tpl .Values.global.consentManagerHostname $ }}/*'
          clientRoles:
            # Required by partner/policy admin endpoints. Must match
            # global.consentManagerAdminRole.
            - CONSENT_MANAGER_ADMIN
      users:
        # First-install operator can administer partners/policies from the UI/CLI.
        - username: admin
          clientRoleMappings:
            consent-manager:
              - CONSENT_MANAGER_ADMIN
        # The client's own service account gets admin too, so client-credentials
        # tokens from `consent-manager` can drive partner onboarding automation.
        - username: service-account-consent-manager
          clientRoleMappings:
            consent-manager:
              - CONSENT_MANAGER_ADMIN

consentManagerApi:
  enabled: true
  nameOverride: api
  hostname: '{{ tpl .Values.global.consentManagerHostname $ }}'
  replicaCount: 1

  # Horizontal scaling — the pods are stateless, so turn this on for high
  # consent-verification load. Off by default (a single replica is enough).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # Memory-based autoscaling is intentionally OFF: a Python process's memory
    # baseline can exceed the request and never shrink, which makes a memory HPA
    # scale up to maxReplicas and stay there. Autoscale on CPU only.
    targetMemoryUtilizationPercentage: null

  updateStrategy:
    type: RollingUpdate

  serviceAccount:
    create: false
    name: ""

  image:
    repository: openg2p/openg2p-consent-manager
    # Image tag — defaults to the develop stream. Override per release/deploy
    # (e.g. --set consentManagerApi.image.tag=1.2.0).
    tag: "develop"
    pullPolicy: Always

  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /api/consent-manager
  containerPort: 8000

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.consentManagerApi.hostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-api'
      destinationPort: 80
      prefix: '{{ .Values.consentManagerApi.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false

  # ── CM signing key (.p12) mounted from a Secret ─────────────────────────
  # Enabled by default with a BUNDLED DEMO key so a fresh install signs receipts
  # with a fixed, consistent key out of the box (for testing). REPLACE IT FOR
  # PRODUCTION — the demo key + password ship in this chart and are public.
  signingKey:
    enabled: true
    # Where the .p12 comes from:
    #   demo     → use the demo key bundled in this chart (files/cm_signing_demo.p12).
    #              Fixed, consistent across pods. Testing only.
    #   existing → reference a Secret you created via Rancher Storage → Secrets
    #              (file upload — no CLI). Set `secretName` to its name. PRODUCTION.
    #   inline   → the chart creates the Secret from `p12Base64` + `password` below.
    #              Convenient, but the material lives in the Helm release.
    mode: demo
    demoPassword: openg2p
    # Inline material — used only when mode=inline:
    p12Base64: ""
    password: ""
    # Secret reference (the chart-created Secret, for demo/inline, also takes this name):
    secretName: consent-manager-signing
    secretKey: cm_signing.p12
    mountPath: /app/secrets
    passwordSecretName: consent-manager-signing
    passwordSecretKey: password

  # ── Periodic expiry sweep (CronJob) ─────────────────────────────────────
  # Keeps API pods stateless — expiry runs once per tick regardless of replicas.
  expiryCronjob:
    enabled: true
    schedule: "*/15 * * * *"
    backoffLimit: 1

  envVars:
    CONSENT_MANAGER_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    CONSENT_MANAGER_DB_DBNAME: '{{ tpl .Values.global.consentDB $ }}'
    CONSENT_MANAGER_DB_PORT: '{{ .Values.global.consentDBPort }}'
    CONSENT_MANAGER_DB_USERNAME: '{{ tpl .Values.global.consentDBUser $ }}'
    CONSENT_MANAGER_APP_PORT: '{{ .Values.containerPort }}'
    CONSENT_MANAGER_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'
    CONSENT_MANAGER_AUTH_ENABLED: '{{ .Values.global.consentManagerAuthEnabled }}'
    CONSENT_MANAGER_AUTH_ISSUER: '{{ tpl .Values.global.keycloakIssuerUrl $ }}'
    CONSENT_MANAGER_AUTH_JWKS_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/certs'
    CONSENT_MANAGER_AUTH_ADMIN_ROLE: '{{ tpl .Values.global.consentManagerAdminRole $ }}'
    # In demo mode, force a distinctive kid so any receipt / JWKS makes it obvious
    # a demo (insecure) key is in use; otherwise use the configured kid.
    CONSENT_MANAGER_CM_SIGNING_KID: '{{ if eq .Values.signingKey.mode "demo" }}cm-demo-INSECURE{{ else }}{{ tpl .Values.global.consentSigningKid $ }}{{ end }}'
    CONSENT_MANAGER_CM_SIGNING_IS_DEMO: '{{ if and .Values.signingKey.enabled (eq .Values.signingKey.mode "demo") }}true{{ else }}false{{ end }}'
    # Only set when the .p12 Secret is actually mounted; empty otherwise so the
    # service falls back to PEM/ephemeral instead of crashing on a missing file.
    CONSENT_MANAGER_CM_SIGNING_P12_PATH: '{{ if .Values.signingKey.enabled }}{{ .Values.signingKey.mountPath }}/{{ .Values.signingKey.secretKey }}{{ end }}'

  envVarsFrom:
    CONSENT_MANAGER_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.consentDBSecret $ }}'
        key: '{{ tpl .Values.global.consentDBUserPasswordKey $ }}'
    CONSENT_MANAGER_CM_SIGNING_P12_PASSWORD:
      secretKeyRef:
        name: '{{ .Values.signingKey.passwordSecretName }}'
        key: '{{ .Values.signingKey.passwordSecretKey }}'
        optional: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
      - 'sh'
    args:
      - '-c'
      - 'until pg_isready -U ${CONSENT_MANAGER_DB_USERNAME} -h ${CONSENT_MANAGER_DB_HOSTNAME} -p ${CONSENT_MANAGER_DB_PORT:-5432} -d ${CONSENT_MANAGER_DB_DBNAME:-consent_manager_db}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

# ── In-cluster sanity suite ─────────────────────────────────────────────────
# A Helm post-install/post-upgrade Job that runs the sanity tests against the
# freshly deployed service — so a broken image/config is flagged on every
# Rancher Install/Upgrade, no command line needed. Non-blocking by default.
sanity:
  enabled: true
  image:
    repository: openg2p/openg2p-consent-manager-sanity
    tag: develop
    pullPolicy: Always
  # In-cluster Service URL (no ingress path prefix). The chart Service is
  # <release>-api on port 80.
  baseUrl: 'http://{{ .Release.Name }}-api'
  verifyTls: false
  # false → smoke + contract only (creates no data, needs no token).
  # true  → also the data-creating /validate round-trip (needs Keycloak token).
  runE2e: false
  # false → the Job exits 0 even if tests fail (never blocks the install; read
  #         the pod logs). true → a failing run fails the install/upgrade.
  failOnError: false
  readinessTimeout: 180
  controllerId: sanity-controller
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
