questions:
# ------------------------------ General -----------------------------
# Hostnames are <service>.<Base Domain>; override one only if it must differ.
- variable: global.baseDomain
  description: Domain every hostname sits under (<service>.<Base Domain>). Use the same value as the commons install. Defaults to <namespace>.openg2p.org.
  type: string
  label: Base Domain
  group: General
- variable: global.consentManagerHostname
  description: Hostname for the Consent Manager API
  type: string
  label: Consent Manager Hostname
  group: General
- variable: global.partnerManagementUiUrl
  description: Link to Partner Management's staff UI, shown in the console. Partners, their keys and their policies are managed there. Empty = no link.
  type: string
  label: Partner Management UI URL
  group: General
- variable: consentManagerApi.openapiRootPath
  description: Path prefix the API is served under (behind the ingress/VirtualService)
  type: string
  default: /api/consent-manager
  label: API Root Path
  group: General
- variable: consentManagerApi.image.tag
  description: Container image tag to deploy (e.g. develop or a release like 1.2.0)
  type: string
  default: develop
  label: Image Tag
  group: General

# ---------------------------- Database ------------------------------
- variable: global.postgresqlHost
  description: PostgreSQL host for the Consent Manager database
  type: string
  default: commons-postgresql
  label: PostgreSQL Host
  group: Database

# -------------------------- Authentication --------------------------
- variable: global.consentManagerAuthEnabled
  description: Require Keycloak bearer tokens on protected endpoints. Turn off only for local/dev.
  type: boolean
  default: true
  label: Enable Keycloak Auth
  group: Authentication
- variable: global.keycloakBaseUrl
  description: Base URL of the Keycloak server (used to derive issuer + JWKS)
  type: string
  label: Keycloak Base URL
  group: Authentication
  show_if: global.consentManagerAuthEnabled=true
- variable: global.keycloakRealm
  description: Keycloak realm the Consent Manager client and roles live under
  type: string
  default: staff
  label: Keycloak Realm
  group: Authentication
  show_if: global.consentManagerAuthEnabled=true
- variable: global.consentManagerAdminRole
  description: Role required to call the admin endpoints
  type: string
  default: CONSENT_MANAGER_ADMIN
  label: Admin Role
  group: Authentication
  show_if: global.consentManagerAuthEnabled=true
- variable: keycloak-init.enabled
  description: Provision the consent-manager Keycloak client and admin role automatically (requires Keycloak admin access)
  type: boolean
  default: true
  label: Provision Keycloak Client
  group: Authentication
  show_if: global.consentManagerAuthEnabled=true

# ----------------------------- Signing ------------------------------
# Receipts are ALWAYS signed; the only choice is where the .p12 comes from.
- variable: consentManagerApi.signingKey.mode
  description: "Where the receipt-signing .p12 comes from. demo = bundled demo key (testing only — public, replace for production); existing = reference a Secret you uploaded via Storage → Secrets (production); inline = paste the .p12 base64 below."
  type: enum
  options:
    - demo
    - existing
    - inline
  default: demo
  label: Signing Key Source
  group: Signing
- variable: consentManagerApi.signingKey.secretName
  description: "Name of the existing Secret holding the .p12 (key cm_signing.p12) and its password (key password), in this namespace. Create it first via Storage → Secrets with a file upload."
  type: string
  default: consent-manager-signing
  label: Existing Signing Secret
  group: Signing
  show_if: consentManagerApi.signingKey.mode=existing
- variable: consentManagerApi.signingKey.p12Base64
  description: Base64-encoded contents of your .p12 file (paste it here).
  type: multiline
  label: .p12 (base64)
  group: Signing
  show_if: consentManagerApi.signingKey.mode=inline
- variable: consentManagerApi.signingKey.password
  description: Password that unlocks the .p12 keystore
  type: password
  label: .p12 Password
  group: Signing
  show_if: consentManagerApi.signingKey.mode=inline
- variable: global.consentSigningKid
  description: A label (kid) for the signing key, advertised in JWKS and stamped on receipts. NOT read from the .p12 — set your own when using your own key, and change it on every key rotation.
  type: string
  default: cm-2025-01
  label: Signing Key ID
  group: Signing
  show_if: consentManagerApi.signingKey.mode!=demo

# ----------------------------- Scaling ------------------------------
- variable: consentManagerApi.autoscaling.enabled
  description: Autoscale the stateless API pods on CPU/memory. Enable for high consent-verification rates; a single replica is enough otherwise.
  type: boolean
  default: false
  label: Enable Autoscaling
  group: Scaling
- variable: consentManagerApi.autoscaling.minReplicas
  description: Minimum number of API pods
  type: int
  default: 1
  label: Min Replicas
  group: Scaling
  show_if: consentManagerApi.autoscaling.enabled=true
- variable: consentManagerApi.autoscaling.maxReplicas
  description: Maximum number of API pods
  type: int
  default: 20
  label: Max Replicas
  group: Scaling
  show_if: consentManagerApi.autoscaling.enabled=true
- variable: consentManagerApi.replicaCount
  description: Fixed number of API pods (used when autoscaling is off)
  type: int
  default: 1
  label: Replica Count
  group: Scaling
  show_if: consentManagerApi.autoscaling.enabled=false

# ----------------------------- Expiry -------------------------------
- variable: consentManagerApi.expiryCronjob.enabled
  description: Run the consent-expiry sweep as a CronJob (keeps API pods stateless)
  type: boolean
  default: true
  label: Enable Expiry CronJob
  group: Expiry
- variable: consentManagerApi.expiryCronjob.schedule
  description: Cron schedule for the expiry sweep
  type: string
  default: "*/15 * * * *"
  label: Expiry Schedule
  group: Expiry
  show_if: consentManagerApi.expiryCronjob.enabled=true

# ----------------------------- Sanity -------------------------------
# If sanity runs, it GATES the deploy: a failure fails the install/upgrade (the
# Job is a Helm hook). The default smoke+contract level creates no data and is
# safe everywhere — leave it on.
- variable: sanity.enabled
  description: Run the smoke + contract sanity tests on every install/upgrade and GATE on them (a failure fails the deploy). They create no data and are safe in every environment, so keep this ON. Only break-glass case to turn it off — the sanity IMAGE itself can't run (e.g. it wasn't mirrored / a bad build), which would block the deploy at the pod level (the report-only flag can't rescue that). Results are in the Job pod's logs.
  type: boolean
  default: true
  label: Run Sanity Tests (gates the deploy)
  group: Sanity
- variable: sanity.runE2e
  description: "Run the full end-to-end /validate round-trip too (on by default). It is the ONLY part that creates data — keeps a test partner (PARTNER_CM_SANITY), its key and its policy in Partner Management and needs a Keycloak token at deploy time. Turn OFF for production where you don't want test data; smoke + contract still run and gate."
  type: boolean
  default: true
  label: Run Full E2E (creates a test partner)
  group: Sanity
  show_if: sanity.enabled=true

# ------------------------------ Exchange ----------------------------
# Off by default: a standalone install leaves this alone. Pick a role and the
# defaults are the reference values (Agri Stack's); fill the fields only to differ.
- variable: global.agriStackExchange.role
  description: "Role of this Consent Manager in a data exchange (e.g. Agri Stack), where a Composite reads several registries. exchange: choose on the Exchange's install; this CM issues the Composite a consent token per registry. department: choose on each registry's install (e.g. a department's Farmer Registry); this CM accepts consent tokens from the Exchange CM. none: not part of a data exchange."
  type: enum
  options: [none, exchange, department]
  default: none
  label: Exchange Role
  group: Exchange
- variable: global.agriStackExchange.issuer
  description: "The issuer ID on the tokens this CM signs. Empty = agri-stack-exchange-cm."
  type: string
  default: ""
  label: Token Issuer ID
  group: Exchange
  show_if: global.agriStackExchange.role=exchange
- variable: global.agriStackExchange.receiptPresenters
  description: "Comma-separated partner IDs of the Composite(s) that may ask this CM for consent tokens, not the partners (e.g. banks) they serve. Empty = agri-composite."
  type: string
  default: ""
  label: Token Presenters
  group: Exchange
  show_if: global.agriStackExchange.role=exchange
- variable: global.agriStackExchange.receiptTtlSeconds
  description: "Token lifetime in seconds (capped by the consent's expiry)."
  type: int
  default: 900
  label: Token Lifetime (seconds)
  group: Exchange
  show_if: global.agriStackExchange.role=exchange
- variable: global.agriStackExchange.compositeApiUrl
  description: "The Composite's API URL (in-cluster). Partner-portal and lifecycle consents here are made for a use case granted to the partner in Partner Management; the use case's purpose and scopes per registry are read from it. Empty = http://agri-composite-api (the Composite in this namespace)."
  type: string
  default: ""
  label: Composite API URL
  group: Exchange
  show_if: global.agriStackExchange.role=exchange
- variable: global.agriStackExchange.exchangeDomain
  description: "The Exchange install's domain, e.g. agrix.example.org. Empty = agrix.<parent of this install's domain> (agrix.openg2p.org for trial.openg2p.org)."
  type: string
  default: ""
  label: Exchange Domain
  group: Exchange
  show_if: global.agriStackExchange.role=department
- variable: global.agriStackExchange.trustedIssuer.issuer
  description: "The Exchange CM's issuer ID. Empty = agri-stack-exchange-cm."
  type: string
  default: ""
  label: Trusted Token Issuer ID
  group: Exchange
  show_if: global.agriStackExchange.role=department
- variable: global.agriStackExchange.trustedIssuer.presenter
  description: "The partner ID of the Composite: the only caller that may present the Exchange's consent tokens here. Empty = agri-composite. Partners that call this registry directly, with a consent of their own, are not affected. Its scope policy per registry is in this install's Partner Management (setup_exchange.py raises and approves it)."
  type: string
  default: ""
  label: Trusted Token Presenter
  group: Exchange
  show_if: global.agriStackExchange.role=department
- variable: global.agriStackExchange.trustedIssuer.jwksUrl
  description: "The Exchange CM's JWKS URL. Empty = https://consent-manager-partner.<exchange domain>/api/consent-manager-partner/.well-known/jwks.json."
  type: string
  default: ""
  label: Trusted Issuer JWKS URL
  group: Exchange
  show_if: global.agriStackExchange.role=department
- variable: global.agriStackExchange.receiptStatusCheck
  description: "Check each token's status (revoked/expired) at the Exchange CM."
  type: enum
  options: [always, never]
  default: always
  label: Token Status Check
  group: Exchange
  show_if: global.agriStackExchange.role=department

# --------------------------- Partner portal -------------------------
# Off by default: a standalone install leaves this alone. ON deploys the
# partner portal SPA, provisions the Keycloak `partner` realm + client, gives
# the staff api the partner-realm token settings and turns on evidence storage.
- variable: partnerPortal.enabled
  description: "Turn on where partners' staff collect consent in this Consent Manager: in person, with the subject's national-ID login and signed form, checked by CM staff (e.g. on the Exchange's install). A registry's own install does not need it today: partners that call the registry directly present a consent they collected and signed themselves. Creates the Keycloak realm `partner`; after install, run deployment/scripts/setup-partner-realm.sh once for its roles and partner users. Also turns on evidence storage."
  type: boolean
  default: false
  label: Partner Portal
  group: Partner portal
- variable: global.consentPartnerPortalHostname
  description: Hostname of the partner portal (also its Keycloak client's redirect URI)
  type: string
  label: Partner Portal Hostname
  group: Partner portal
  show_if: partnerPortal.enabled=true
- variable: partnerPortal.compositeUrl
  description: "Optional Composite base URL (e.g. the Exchange's use-case service). When set, the portal lists the Composite's use cases and can prefill a request from one. Empty = none; for the exchange role, https://agri-composite.<this domain>."
  type: string
  default: ""
  label: Composite URL
  group: Partner portal
  show_if: partnerPortal.enabled=true
- variable: partnerPortal.subjectAuth.enabled
  description: "The subject's national-ID login through eSignet, mandatory on every request (with the signed form and the staff check). Needs eSignet (and, for testing, the mock identity system) in the namespace; a job registers this CM's client in eSignet."
  type: boolean
  default: false
  label: Require National-ID Login (eSignet)
  group: Partner portal
  show_if: partnerPortal.enabled=true&&global.agriStackExchange.role!=exchange
- variable: partnerPortal.requiredSubjectIdentifiers
  description: "Comma-separated identifiers every request must carry besides the subject ID, checked by staff in the registry before approving. Empty = none; for the exchange role, FARMER_ID."
  type: string
  default: ""
  label: Required Subject Identifiers
  group: Partner portal
  show_if: partnerPortal.enabled=true
- variable: evidence.s3.endpoint
  description: "S3 endpoint for the uploaded signed consent forms (commons Garage by default). The bucket must exist and the key be allowed on it."
  type: string
  default: http://commons-garage:3900
  label: Evidence Storage Endpoint
  group: Partner portal
  show_if: partnerPortal.enabled=true
- variable: evidence.s3.bucket
  description: Bucket for the signed consent forms
  type: string
  default: consent-evidence
  label: Evidence Bucket
  group: Partner portal
  show_if: partnerPortal.enabled=true
- variable: evidence.s3.existingSecret
  description: "Secret holding the S3 access key (key root-user) and secret key (key root-password). Default: the commons Garage Secret commons-minio."
  type: string
  default: commons-minio
  label: Evidence Storage Secret
  group: Partner portal
  show_if: partnerPortal.enabled=true
