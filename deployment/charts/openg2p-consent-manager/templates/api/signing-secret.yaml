{{- $values := .Values.consentManagerApi -}}
{{- $context := dict "Values" (merge (deepCopy $values) (dict "global" .Values.global)) "Chart" .Chart "Release" .Release "Files" .Files "Capabilities" .Capabilities -}}
{{- with $context -}}
{{- $sk := .Values.signingKey -}}
{{- if and $sk.enabled (or (eq $sk.mode "demo") (eq $sk.mode "inline")) }}
{{- if and (eq $sk.mode "inline") (not $sk.p12Base64) }}
{{- fail "consentManagerApi.signingKey.mode is 'inline' but p12Base64 is empty — paste the base64 of your .p12, or use mode 'existing'/'demo'." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sk.secretName }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
type: Opaque
data:
  {{- if eq $sk.mode "demo" }}
  # Bundled DEMO key — public, testing only. Replace for production (mode=existing/inline).
  {{ $sk.secretKey }}: {{ $.Files.Get "files/cm_signing_demo.p12" | b64enc }}
  {{- else }}
  # Already base64 (a .p12 is binary; the form value is its base64 encoding).
  {{ $sk.secretKey }}: {{ $sk.p12Base64 }}
  {{- end }}
stringData:
  {{ $sk.passwordSecretKey }}: {{ ternary $sk.demoPassword $sk.password (eq $sk.mode "demo") | quote }}
{{- end }}
{{- end -}}
