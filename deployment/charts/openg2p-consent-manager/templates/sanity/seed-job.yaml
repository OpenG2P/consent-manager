{{- if and .Values.sanity.enabled .Values.sanity.runE2e -}}
{{- $s := .Values.sanity -}}
# Deploy-time seeding of the persistent Partner Management test partner.
#
# The signed /validate e2e needs a real partner + key in Partner Management. This
# Job seeds it (idempotently) as part of every install/upgrade — BEFORE the
# sanity test Job — so seeding is a deploy step, not a side effect of the test.
# It only runs when the e2e that needs it is enabled (sanity.enabled + runE2e).
# Best-effort: a seeding failure is logged but does NOT block the deploy — the
# e2e itself gates (and skips gracefully if PM is unreachable).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pm-seed
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: pm-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Weight 0 → runs before the sanity Job (weight 5).
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: {{- include "common.labels.matchLabels" (dict "customLabels" .Values.podLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: pm-seed
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pm-seed
          image: "{{ $s.image.repository }}:{{ $s.image.tag }}"
          imagePullPolicy: {{ $s.image.pullPolicy }}
          resources: {{- toYaml $s.resources | nindent 12 }}
          # Override the sanity entrypoint: run the seed, never hard-fail the
          # deploy (the e2e Job is the real gate).
          command: ["sh", "-c", "python -m sanity.pm_seed || echo '[pm-seed] non-fatal error; continuing deploy'"]
          env:
            {{- include "consentManagerSanity.pmSeedEnv" . | nindent 12 }}
            # Fallback PM-admin credentials: the consent-manager client (must hold
            # the partner_manager role) when no dedicated SANITY_PM_ADMIN_* is set.
            {{- include "consentManagerSanity.kcClientEnv" . | nindent 12 }}
{{- end }}
