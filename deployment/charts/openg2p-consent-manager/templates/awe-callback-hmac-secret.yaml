{{- /*
AWE callback HMAC signing secret (minted here, mirrors the registry pattern).

Not a DB credential, so we mint it directly rather than via postgres-init.
Semantics match postgres-init's secret.yaml: a random value, created as a
pre-install/pre-upgrade hook, kept across reinstalls (resource-policy: keep),
and lookup-guarded so an existing value stays stable — the AWE `callback_secret`
row seeded by awe-callback-seed and CM's webhook verifier must agree on it.
*/ -}}
{{- if .Values.global.aweEnabled }}
{{- $name := tpl .Values.global.aweCallbackHmacSecretName $ }}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.global.aweCallbackHmacSecretKey | quote }}: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- end }}
